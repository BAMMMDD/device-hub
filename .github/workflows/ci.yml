name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Check
        run: cargo check --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p device-hub -p devhub-obs
      - name: Package OBS plugin
        run: |
          New-Item -ItemType Directory -Force dist/devhub_obs/bin/64bit, dist/devhub_obs/data/locale | Out-Null
          Copy-Item target/release/devhub_obs.dll dist/devhub_obs/bin/64bit/
          Copy-Item crates/devhub-obs/data/locale/*.ini dist/devhub_obs/data/locale/
          Copy-Item target/release/device-hub.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: device-hub-windows-x64
          path: dist/
